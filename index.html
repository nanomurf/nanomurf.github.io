<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboTEC News</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #0f172a;
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 8px;
        }
        p {
            font-size: 1rem;
            line-height: 1.5;
            color: #475569;
        }
        .link-line {
            margin-top: 24px;
            padding: 12px 16px;
            background-color: #f1f5f9;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
            font-weight: 500;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the RoboTEC Robotics Club info page.</h1>
        <div class="link-line">
            TinkerCad class page: <a href="https://www.tinkercad.com/joinclass/CWMEXEWKP">TinkerCad Class</a>
        </div>
    </div>
</body>
</html>
